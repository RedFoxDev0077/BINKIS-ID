name: binkis-id

# Values come from /opt/binkis-id/.env on the host, passed with --env-file.
# CLAIM_CODE_PEPPER is generated on the server and exists nowhere else: not in
# this repository, not in GitHub Actions secrets, not in an image layer. It
# cannot be rotated once holograms are printed, so its blast radius is every
# claim code ever manufactured.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: binkis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: binkis_id
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/init-staging.sql:/docker-entrypoint-initdb.d/10-staging.sql:ro
    # Deliberately not published to the host. The database is reachable only
    # on the compose network, so it is never exposed to the internet even if
    # the firewall were misconfigured.
    expose:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U binkis -d binkis_id']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot. Applies pending migrations, then exits. The app waits for it to
  # exit zero, so a failed migration stops the deploy rather than starting an
  # app against a schema it does not match.
  #
  # Built from the builder stage because the Prisma CLI needs its full
  # dependency tree, which the slim runtime image deliberately does not carry.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: ['npx', 'prisma', 'migrate', 'deploy']
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      STAGING_DATABASE_URL: ${STAGING_DATABASE_URL:-}
      CLAIM_CODE_PEPPER: ${CLAIM_CODE_PEPPER:?CLAIM_CODE_PEPPER is required}
      FACTORY_EXPORT_KEY: ${FACTORY_EXPORT_KEY:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://id.binkis.com}
      NODE_ENV: production
    expose:
      - '3000'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
